<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Mark IV</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hologram-suite">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div id="jarvis-orb"></div>
    </div>

    <div class="interface-panel">
        <h1 class="status-text">J.A.R.V.I.S.</h1>
        <button id="btn-escuchar">Activar Protocolo</button>
        <input type="file" id="file-selector" accept="image/*" style="display: none;">
        <button id="btn-imagen">Adjuntar Evidencia</button>
    </div>

    <div class="hud-derecho">
        <div class="hud-header">DATOS DE TRANSMISIÓN</div>
        <div id="jarvis-subtitulos" class="hud-texto">Esperando inicialización de protocolo...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
